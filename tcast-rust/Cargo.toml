[package]
name = "tcast-rust"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "bmp", "tga", "tiff", "webp"] }
rfd = "0.15"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tao = "0.35"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
url = "2"
walkdir = "2"
wry = "0.55"
zip = { version = "0.6", default-features = false, features = ["deflate"] }
